<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenSearch — Next-Gen Search Experience</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark-theme">

  <canvas id="matrix-bg"></canvas>

  <header>
    <div class="nav-links">
      <a href="#">Images</a>
      <a href="#">Maps</a>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <main class="search-container">
    <div class="logo">
      <span class="brand-accent">Gen</span>Search<span class="brand-dot">.</span>
    </div>

    <div class="search-box">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search the web... (Press '/' to focus)" 
          autocomplete="off"
          autofocus
        />
        <button id="clear-btn" class="icon-btn hidden">&times;</button>
      </div>

      <ul id="suggestions-list" class="suggestions hidden"></ul>
    </div>

    <div class="search-actions">
      <button id="search-btn" class="btn btn-primary">Gen Search</button>
      <button id="lucky-btn" class="btn btn-secondary">I'm Feeling Lucky</button>
    </div>

    <div class="recent-searches">
      <span class="recent-label">Recent:</span>
      <div id="history-tags" class="tags-wrapper"></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 GenSearch • Built with HTML, CSS, & TypeScript</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
